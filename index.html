<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
    <title>나랏말싸미 - 한글 타자 연습</title>
    
    <!-- SEO & 검색 최적화 -->
    <meta name="description" content="한글의 아름다움을 타자로 느껴보세요. 훈민정음 서문과 윤동주, 김소월 등 명시를 필사하듯 칠 수 있는 모던한 한글 타자 연습 사이트입니다.">
    <meta name="keywords" content="나랏말싸미, 한글 타자, 타자 연습, 훈민정음, 시 타자, 필사, 한글 연습, 타자 치기">
    <meta name="author" content="나랏말싸미">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://naramarsami.github.io/naramarsami/">
    
    <!-- Open Graph (SNS 공유 및 검색 미리보기) -->
    <meta property="og:title" content="나랏말싸미 - 모던 한글 타자 연습">
    <meta property="og:description" content="한글의 아름다움을 타자로 느껴보세요. 명시를 필사하는 모던 감성 타자 연습 사이트">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://naramarsami.github.io/naramarsami/">
    <meta property="og:site_name" content="나랏말싸미">
    
    <link rel="stylesheet" href="style.css?v=11">
</head>
<body>
    <div class="wrapper">
        <header>
            <h1 class="sr-only">나랏말싸미 - 한글 타자 연습</h1>
            <a class="logo" href="https://xn--lg3by0shrak48b.kro.kr/" aria-label="나랏말싸미 홈">나랏말싸미</a>
            <nav class="nav-links" aria-label="메인 메뉴">
                <div class="lang-selector">
                    <button type="button" class="active" id="hangul-btn" data-language="ko" aria-pressed="true">한글</button>
                    <span class="nav-divider" aria-hidden="true">/</span>
                    <button type="button" id="english-btn" data-language="en" aria-pressed="false">English</button>
                </div>
                <div class="nav-controls">
                    <button id="search-btn" class="icon-btn" aria-label="글 검색">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    </button>
                    <button id="skip-btn" class="icon-btn" aria-label="새 글 (새로고침)">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
                    </button>
                    <button id="help-btn" class="icon-btn" type="button" aria-label="연습 가이드" aria-expanded="false" aria-controls="practice-guide">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                    </button>
                    <button id="settings-btn" class="icon-btn" aria-label="설정">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                    </button>
                </div>
            </nav>
        </header>

        <main>
            <article class="main-content">
                <div class="poem-info" id="poem-info">
                    <span id="poem-title"></span>
                    <span class="divider">-</span>
                    <span id="poem-author"></span>
                    <a id="work-source" class="work-source" target="_blank" rel="noopener" hidden>원문 보기 ↗</a>
                </div>
                <div class="novel-stage" id="novel-stage" hidden>
                    <nav id="stage-steps" aria-label="소설 연습 단계"></nav>
                    <p id="stage-title"></p>
                </div>
                
                <section class="typing-container" aria-label="타자 연습 영역">
                    <div id="text-display" class="text-display" aria-hidden="true">
                        <!-- Text will be injected here -->
                    </div>
                </section>
                
                <p id="line-instruction" class="sr-only" aria-live="polite"></p>
                <input type="text" id="typing-input" inputmode="text" autocomplete="off" autocorrect="off"
                    autocapitalize="off" spellcheck="false" enterkeyhint="done"
                    aria-label="타자 입력창" aria-describedby="line-instruction practice-hint"
                    placeholder="위 문장을 입력하세요">
                <p id="practice-hint" class="sr-only">한 줄을 정확하게 입력하면 다음 줄로 이어져요.</p>
            </article>
            <aside class="practice-guide" id="practice-guide" aria-labelledby="practice-guide-title" hidden>
                <div class="practice-guide-heading">
                    <h2 id="practice-guide-title">연습 가이드</h2>
                    <button class="icon-btn" id="close-guide-btn" type="button" aria-label="연습 가이드 닫기">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
                    </button>
                </div>
                <div class="guide-metrics">
                    <div class="guide-metric">
                        <h3>최근 입력 언어</h3>
                        <p class="guide-metric-value" id="guide-language">대기</p>
                        <p class="guide-metric-note" id="guide-language-note" role="status">입력하면 표시돼요.</p>
                    </div>
                    <div class="guide-metric">
                        <h3>현재 줄 진행률</h3>
                        <p class="guide-metric-value" id="guide-progress-value">0%</p>
                        <progress id="guide-progress" aria-label="현재 줄 진행률" max="100" value="0"></progress>
                    </div>
                </div>
                <div class="guide-keyboard-heading">
                    <h3>다음 글자 위치</h3>
                    <p id="guide-next-key"></p>
                </div>
                <div class="guide-keyboard" id="guide-keyboard" aria-hidden="true"></div>
                <p class="guide-hint" id="help-typing-hint"></p>
            </aside>
        </main>

        <footer>

            <section class="stats" aria-label="현재 타자 통계">
                <div class="stat">
                    <span class="label" id="speed-label" title="한글은 두벌식 기준 분당 환산 타수">타수</span>
                    <span class="value" id="wpm">0</span>
                </div>
                <div class="stat">
                    <span class="label">정확도</span>
                    <span class="value" id="accuracy">100%</span>
                </div>
            </section>
            <nav class="footer-links" aria-label="사이트 안내">
                <a href="./about.html">소개</a>
                <a href="./brand.html">브랜드 가이드</a>
                <button id="history-btn" type="button">내 기록</button>
            </nav>
        </footer>
    </div>

    <!-- Result Modal -->
    <dialog id="result-modal" class="modal" aria-labelledby="modal-title">
        <div class="modal-content">
            <h2 class="modal-title" id="modal-title" tabindex="-1">작성 완료</h2>
            <p id="result-work" class="modal-poem-info"></p>
            <section class="stage-preview" id="stage-preview" aria-labelledby="stage-preview-title" hidden>
                <div class="stage-preview-meta">
                    <span id="stage-preview-step"></span>
                    <span id="stage-countdown" role="timer"></span>
                </div>
                <h3 id="stage-preview-title"></h3>
                <p class="stage-preview-line" id="stage-preview-line"></p>
                <div class="stage-countdown-track" aria-hidden="true"></div>
                <div class="stage-preview-actions">
                    <button type="button" id="stop-stage-btn">그만하기</button>
                    <button type="button" id="continue-stage-btn">지금 이어쓰기 <span aria-hidden="true">→</span></button>
                </div>
            </section>
            
            <div class="modal-stats">
                <div class="modal-stat">
                    <span class="label" id="result-speed-label">최종 타수</span>
                    <span class="value" id="modal-wpm">0</span>
                </div>
                <div class="modal-stat">
                    <span class="label">정확도</span>
                    <span class="value" id="modal-acc">100%</span>
                </div>
                <div class="modal-stat">
                    <span class="label">오타 횟수</span>
                    <span class="value" id="modal-errors">0</span>
                </div>
            </div>
            
            <p id="result-time" class="dialog-note"></p>
            <div class="modal-actions">
                <button id="share-btn" class="secondary" title="현재 기록을 복사합니다">기록 공유</button>
                <button id="ranking-btn" class="secondary">나의 기록</button>
                <button id="retry-btn" class="secondary">같은 작품 다시</button>
                <button id="next-btn" title="다음 작품을 연습합니다">다음 글로</button>
            </div>
            <p id="result-status" role="status" class="dialog-note"></p>
            <form id="result-close-form" method="dialog"><button id="close-result-btn" class="dialog-close" type="submit">닫기</button></form>
        </div>
    </dialog>

    <!-- Ranking Modal -->
    <dialog id="ranking-modal" class="modal" aria-labelledby="history-title">
        <div class="modal-content">
            <h2 class="modal-title" id="history-title">나의 타자 기록</h2>
            <label class="dialog-filter" for="history-filter">기록 범위
                <select id="history-filter">
                    <option value="all">모든 기록</option>
                    <option value="work">이 작품</option>
                    <option value="ko">한글</option>
                    <option value="en">영어</option>
                    <option value="legacy">이전 방식의 기록</option>
                </select>
            </label>
            <ul class="ranking-list" id="ranking-list">
                <!-- Records injected here -->
            </ul>
            <form method="dialog"><button id="close-ranking-btn" class="secondary" type="submit">닫기</button></form>
        </div>
    </dialog>

    <!-- Unified Settings Modal -->
    <dialog id="settings-modal" class="modal" aria-labelledby="settings-title">
        <div class="modal-content settings-content">
            <h2 class="modal-title" id="settings-title">설정</h2>
            <p class="modal-poem-info" style="margin-bottom: 1.5rem;">자신만의 작업 환경을 꾸며보세요.</p>
            
            <div class="settings-tabs">
                <button class="settings-tab-btn active" data-target="panel-type" aria-pressed="true">글 종류</button>
                <button class="settings-tab-btn" data-target="panel-font" aria-pressed="false">글꼴 설정</button>
                <button class="settings-tab-btn" data-target="panel-theme" aria-pressed="false">테마 & 색상</button>
            </div>
            
            <div class="settings-panels">
                <!-- Panel: Text Type -->
                <div class="settings-panel active" id="panel-type">
                    <h3 class="section-title sr-only">글 종류</h3>
                    <div class="type-flex">
                        <button type="button" class="type-card selected" data-mode="poem" aria-pressed="true"><span class="type-title">시 (Poem)</span><span class="type-preview" style="font-size: 1rem;">나 보기가 역겨워 가실 때에는<br>말없이 고이 보내 드리오리다.</span></button>
                        <button type="button" class="type-card" data-mode="long" aria-pressed="false"><span class="type-title">긴 글 (Long Text)</span><span class="type-preview" style="font-size: 1rem;">여름장이란 애시당초에 글러서, 해는 아직 중천에 있건만 장판은 벌써 쓸쓸하고...</span></button>
                    </div>
                </div>

                <!-- Panel: Fonts -->
                <div class="settings-panel" id="panel-font" style="display: none;">
                    <h3 class="section-title sr-only">글꼴</h3>
                    <div class="options-grid" id="font-options">
                        <button type="button" class="option-card selected" data-font-choice="pretendard">Pretendard</button>
                        <button type="button" class="option-card" data-font-choice="gungsuh">궁서체</button>
                        <button type="button" class="option-card" data-font-choice="serif">Noto Serif</button>
                        <button type="button" class="option-card" data-font-choice="myeongjo">나눔명조</button>
                        <button type="button" class="option-card" data-font-choice="gothic">나눔고딕</button>
                        <button type="button" class="option-card" data-font-choice="batang">고운바탕</button>
                        <button type="button" class="option-card" data-font-choice="gamja">감자꽃</button>
                        <button type="button" class="option-card" data-font-choice="single">싱글데이</button>
                        <button type="button" class="option-card" data-font-choice="mono">JetBrains</button>
                    </div>
                </div>

                <!-- Panel: Themes -->
                <div class="settings-panel" id="panel-theme" style="display: none;">
                    <h3 class="section-title sr-only">테마</h3>
                    <div class="theme-options">
                        <button type="button" class="theme-card selected" data-theme-choice="light"><span class="theme-swatch" style="background:#ffffff; border: 1px solid #ddd;"></span><span>라이트</span></button>
                        <button type="button" class="theme-card" data-theme-choice="dark"><span class="theme-swatch" style="background:#0c0c0c;"></span><span>디프 다크</span></button>
                        <button type="button" class="theme-card" data-theme-choice="sepia"><span class="theme-swatch" style="background:#f4ecd8;"></span><span>세피아</span></button>
                        <button type="button" class="theme-card" data-theme-choice="ocean"><span class="theme-swatch" style="background:#e8f4f8;"></span><span>미드나잇 오션</span></button>
                    </div>
                </div>
            </div>

            <button id="settings-guide-btn" class="dialog-close" type="button" aria-controls="practice-guide">연습 가이드 열기</button>
            <form method="dialog"><button id="close-settings-modal-btn" class="secondary" type="submit">완료</button></form>
        </div>
    </dialog>

    <!-- Search Modal -->
    <dialog id="search-modal" class="modal" aria-labelledby="search-title">
        <div class="modal-content search-modal-content">
            <h2 class="sr-only" id="search-title">작품 찾기</h2>
            <div class="search-header">
                <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input type="search" aria-label="제목, 작가 또는 키워드" id="search-input" placeholder="제목, 작가, 또는 키워드(사랑, 별 등) 검색..." autocomplete="off">
            </div>
            <label class="dialog-filter" for="search-filter">작품 종류
                <select id="search-filter">
                    <option value="all">전체</option><option value="poem">한글 시</option>
                    <option value="novel">소설</option>
                    <option value="long">긴 글</option><option value="en">영어</option>
                </select>
            </label>
            <p id="search-status" role="status" class="dialog-note"></p>
            <div class="search-results-container">
                <div id="search-results" class="search-results-grid">
                    <!-- Dynamically generated searchable results go here -->
                </div>
                <button id="clear-search-btn" class="secondary" type="button" hidden>검색 초기화</button>
            </div>
            <form method="dialog"><button id="close-search-modal-btn" class="dialog-close" type="submit">닫기</button></form>
        </div>
    </dialog>

    <script type="module" src="script.js?v=11"></script>
</body>
</html>
